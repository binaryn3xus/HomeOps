services:
  palworld:
    image: thijsvanloef/palworld-server-docker:latest
    container_name: palworld-server
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "8211:8211/udp"
      - "27015:27015/udp"
    env_file:
      - ./palworld.env
    volumes:
      - /mnt/fastdata/palworld-data:/palworld
    deploy:
      resources:
        limits:
          memory: 14G
        reservations:
          memory: 8G
  palworld-server-dashboard:
    image: ghcr.io/rnz01/palworld-server-dashboard:latest
    container_name: palworld-server-dashboard
    restart: unless-stopped
    user: "0:0"
    ports:
      - "3000:3000"
    env_file:
      - ./dashboard.env
    depends_on:
      - palworld
    volumes:
      - /home/joshua/docker/palworld-dashboard/data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
  portainer:
    image: portainer/portainer-ce:2.39.5
    container_name: palworld-portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
    env_file:
      - ./portainer.env
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
          printf '%s' "$$PORTAINER_ADMIN_PASSWORD" > /tmp/admin-password
          exec /portainer --http-enabled --admin-password-file /tmp/admin-password
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/joshua/docker/palworld-portainer/data:/data
