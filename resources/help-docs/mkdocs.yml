site_name: UNSC Fleet Community & Help
site_description: Guides, service information, and help documentation for UNSC Fleet services.
site_url: https://help.unscfleet.com
site_author: Joshua Garrison

theme:
  name: material
  language: en
  palette:
    # Palette toggle for automatic dark/light mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    logo: material/shield-home

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/binaryn3xus

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Network Access:
      - Getting Connected (Tailscale): access/tailscale.md
  - Dedicated Game Servers:
      - Satisfactory: gaming/satisfactory.md
      - Palworld: gaming/palworld.md
      - Minecraft: gaming/minecraft.md
  - Media & Streaming:
      - Streaming & Requests: media/overview.md
