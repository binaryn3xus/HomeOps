site_name: UNSC Fleet Community & Help
site_description: Guides, service information, and help documentation for UNSC Fleet services.
site_url: https://help.unscfleet.com
site_author: BinaryNexus

theme:
  name: material
  language: en
  palette:
    # Palette toggle for automatic dark/light mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.path
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
  icon:
    logo: material/shield-home

extra:
  social:
    - icon: fontawesome/solid/signal
      link: https://status.unscfleet.com
      name: Fleet System Status
    - icon: fontawesome/brands/github
      link: https://github.com/binaryn3xus
      name: GitHub

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Dedicated Game Servers:
      - Connect with Tailscale: gaming/tailscale.md
      - Satisfactory: gaming/satisfactory.md
      - Palworld: gaming/palworld.md
      - Minecraft: gaming/minecraft.md
  - Media & Streaming:
      - Video Streaming: media/video.md
      - Audiobooks: media/audiobooks.md
      - Requesting Content: media/requests.md
  - Live Status: https://status.unscfleet.com
