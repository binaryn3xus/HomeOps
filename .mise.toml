[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
TALOSCONFIG = "{{config_root}}/talos/talosconfig"
K9S_CONFIG_DIR = "{{config_root}}/resources/k9s"
KUBE_EDITOR = "nano"

[tools]
node = "26.8.2"

# Kubernetes & Infrastructure
cilium-cli = "0.20.0"
cloudflared = "2026.9.0"
flux2 = "2.9.5"
helm = "4.3.0"
helmfile = "1.7.4"
k9s = "0.51.0"
kubecolor = "0.7.1"
kubeconform = "0.8.0"
kubectl = "1.37.0"
kustomize = "5.8.1"
stern = "1.34.0"
talos = "1.14.0"
krew = "0.5.0"
"github:cloudnative-pg/cloudnative-pg" = "1.30.0"

# CLI Utilities
jq = "1.8.2"
just = "1.58.0"
yq = "4.53.6"

# Assistant & Cloud Tools
antigravity-cli = "1.1.28"
codex = "0.153.4"
copilot-cli = "1.0.83"
opencode = "1.18.30"
wrangler = "4.130.0"
gh = "2.100.0"
