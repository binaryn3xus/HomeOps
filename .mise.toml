[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
TALOSCONFIG = "{{config_root}}/talos/talosconfig"
K9S_CONFIG_DIR = "{{config_root}}/resources/k9s"
KUBE_EDITOR = "nano"

[tools]
node = "26.11.1"

# Kubernetes & Infrastructure
cilium-cli = "0.20.1"
cloudflared = "2026.10.0"
flux2 = "2.9.6"
helm = "4.3.0"
helmfile = "1.8.1"
k9s = "0.51.0"
kubecolor = "0.8.0"
kubeconform = "0.8.0"
kubectl = "1.37.1"
kustomize = "5.8.3"
stern = "1.34.0"
talos = "1.14.2"
krew = "0.5.0"
"github:cloudnative-pg/cloudnative-pg" = "1.30.1"

# CLI Utilities
jq = "1.8.2"
just = "1.58.0"
yq = "4.54.1"

# Assistant & Cloud Tools
antigravity-cli = "1.3.2"
codex = "0.153.4"
copilot-cli = "1.0.95"
"github:anomalyco/opencode" = "1.18.35"
wrangler = "4.149.0"
gh = "2.102.0"
gcloud = "585.0.0"
