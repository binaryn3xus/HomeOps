[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
TALOSCONFIG = "{{config_root}}/talos/talosconfig"
K9S_CONFIG_DIR = "{{config_root}}/resources/k9s"
KUBE_EDITOR = "nano"

[tools]
# Kubernetes & Infrastructure
cilium-cli = "0.20.3"
cloudflared = "2026.11.1"
flux2 = "2.10.1"
"github:cloudnative-pg/cloudnative-pg" = "1.30.2"
helm = "4.3.2"
helmfile = "1.8.4"
k9s = "0.51.0"
krew = "0.5.0"
kubecolor = "0.9.0"
kubeconform = "0.8.0"
kubectl = "1.37.2"
kustomize = "5.8.3"
stern = "1.35.0"
talos = "1.14.6"

# CLI Utilities
"aqua:mitsuhiko/minijinja" = "3.1.0"
jq = "1.8.2"
just = "1.59.0"
yq = "4.54.3"

# Runtime, Cloud & Assistant Tools
antigravity-cli = "1.5.14"
codex = "0.153.4"
copilot-cli = "1.0.114"
gcloud = "585.0.0"
gh = "2.105.0"
node = "26.13.1"
opencode = "2.3.2"
wrangler = "4.166.0"
