[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
TALOSCONFIG = "{{config_root}}/talos/talosconfig"
K9S_CONFIG_DIR = "{{config_root}}/resources/k9s"
KUBE_EDITOR = "nano"

[tools]
node = "26.12.1"

# Kubernetes & Infrastructure
cilium-cli = "0.20.1"
cloudflared = "2026.10.4"
flux2 = "2.9.6"
helm = "4.3.1"
helmfile = "1.8.2"
k9s = "0.51.0"
kubecolor = "0.8.0"
kubeconform = "0.8.0"
kubectl = "1.37.1"
kustomize = "5.8.3"
stern = "1.35.0"
talos = "1.14.4"
krew = "0.5.0"
"github:cloudnative-pg/cloudnative-pg" = "1.30.1"

# CLI Utilities
jq = "1.8.2"
just = "1.59.0"
yq = "4.54.1"

# Assistant & Cloud Tools
antigravity-cli = "1.4.7"
codex = "0.153.4"
copilot-cli = "1.0.103"
"github:anomalyco/opencode" = "1.19.4"
wrangler = "4.152.0"
gh = "2.103.2"
gcloud = "585.0.0"
