[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
TALOSCONFIG = "{{config_root}}/talos/talosconfig"
K9S_CONFIG_DIR = "{{config_root}}/resources/k9s"
KUBE_EDITOR = "nano"

[tools]
node = "26.13.1"

# Kubernetes & Infrastructure
cilium-cli = "0.20.3"
cloudflared = "2026.11.0"
flux2 = "2.10.0"
helm = "4.3.2"
helmfile = "1.8.4"
k9s = "0.51.0"
kubecolor = "0.8.0"
kubeconform = "0.8.0"
kubectl = "1.37.2"
kustomize = "5.8.3"
stern = "1.35.0"
talos = "1.14.6"
krew = "0.5.0"
"github:cloudnative-pg/cloudnative-pg" = "1.30.1"

# CLI Utilities
jq = "1.8.2"
just = "1.59.0"
yq = "4.54.3"

# Assistant & Cloud Tools
antigravity-cli = "1.5.8"
codex = "0.153.4"
copilot-cli = "1.0.111"
"github:anomalyco/opencode" = "2.3.0"
wrangler = "4.161.0"
gh = "2.104.0"
gcloud = "585.0.0"
