---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Deploy Palworld Server

on:
  push:
    branches:
      - main
    paths:
      - 'resources/palworld-server/docker/**'
      - '.github/workflows/deploy-palworld.yml'
  workflow_dispatch:

concurrency:
  group: deploy-palworld
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy-management:
    name: Stage configuration and deploy management services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Azure
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Fetch Deploy Secrets from Azure Key Vault
        run: |
          # 1. Fetch values from Key Vault
          TS_ID=$(az keyvault secret show --vault-name "K8sHomeOpsKeyVault" --name "Github-Actions-Tailscale-OAuth-Client-Id" --query 'value' -o tsv)
          TS_SECRET=$(az keyvault secret show --vault-name "K8sHomeOpsKeyVault" --name "Github-Actions-Tailscale-OAuth-Client-Secret" --query 'value' -o tsv)
          SSH_KEY=$(az keyvault secret show --vault-name "K8sHomeOpsKeyVault" --name "Palworld-Server-SSH-Private-Key" --query 'value' -o tsv)
          SSH_HOST=$(az keyvault secret show --vault-name "K8sHomeOpsKeyVault" --name "Palworld-Server-SSH-Host" --query 'value' -o tsv)
          SSH_USER=$(az keyvault secret show --vault-name "K8sHomeOpsKeyVault" --name "Palworld-Server-SSH-User" --query 'value' -o tsv)

          # 2. Mask secrets in GitHub logs
          echo "::add-mask::$TS_ID"
          echo "::add-mask::$TS_SECRET"
          echo "::add-mask::$SSH_HOST"
          echo "::add-mask::$SSH_USER"
          # Mask each line of the SSH key
          while IFS= read -r line; do
            if [[ -n "$line" ]]; then
              echo "::add-mask::$line"
            fi
          done <<< "$SSH_KEY"

          # 3. Export to GitHub Environment for subsequent steps
          echo "TAILSCALE_OAUTH_CLIENT_ID=$TS_ID" >> $GITHUB_ENV
          echo "TAILSCALE_OAUTH_CLIENT_SECRET=$TS_SECRET" >> $GITHUB_ENV
          echo "SSH_HOST=$SSH_HOST" >> $GITHUB_ENV
          echo "SSH_USER=$SSH_USER" >> $GITHUB_ENV

          # Multiline output for SSH private key
          echo "SSH_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          echo "$SSH_KEY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ env.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:github-actions

      - name: Inject Secrets using az-inject.sh
        run: |
          chmod +x ./az-inject.sh
          cp resources/palworld-server/docker/docker-compose.template.yaml docker-compose.yaml
          cat resources/palworld-server/docker/palworld.env.template | ./az-inject.sh > palworld.env
          cat resources/palworld-server/docker/dashboard.env.template | ./az-inject.sh > dashboard.env
          cat resources/palworld-server/docker/portainer.env.template | ./az-inject.sh > portainer.env
          sed -n 's/^PORTAINER_ADMIN_PASSWORD=//p' portainer.env | tr -d '\r\n' > portainer-admin-password
          chmod 600 palworld.env dashboard.env portainer-admin-password

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          cat << 'EOF' > ~/.ssh/id_ed25519
          ${{ env.SSH_PRIVATE_KEY }}
          EOF
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ env.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copy Compose and environment files to Remote Host
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ env.SSH_USER }}@${{ env.SSH_HOST }} "mkdir -p /home/joshua/palworld /home/joshua/docker/palworld-dashboard/data /home/joshua/docker/palworld-portainer/data"
          scp -i ~/.ssh/id_ed25519 docker-compose.yaml ${{ env.SSH_USER }}@${{ env.SSH_HOST }}:/home/joshua/palworld/docker-compose.yml
          scp -i ~/.ssh/id_ed25519 palworld.env dashboard.env portainer-admin-password ${{ env.SSH_USER }}@${{ env.SSH_HOST }}:/home/joshua/palworld/
          ssh -i ~/.ssh/id_ed25519 ${{ env.SSH_USER }}@${{ env.SSH_HOST }} "chmod 600 /home/joshua/palworld/palworld.env /home/joshua/palworld/dashboard.env /home/joshua/palworld/portainer-admin-password"

      - name: Deploy Dashboard and Portainer
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ env.SSH_USER }}@${{ env.SSH_HOST }} "cd /home/joshua/palworld && docker compose config --quiet && docker compose pull palworld-server-dashboard portainer && docker compose up -d --no-deps palworld-server-dashboard portainer"

  deploy-palworld:
    name: Deploy Palworld game server
    needs: deploy-management
    runs-on: ubuntu-latest
    environment:
      name: palworld-production
      url: https://palworld-dashboard.unscfleet.com
    steps:
      - name: Log in to Azure
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Fetch Remote Access Secrets from Azure Key Vault
        run: |
          TS_ID=$(az keyvault secret show --vault-name "K8sHomeOpsKeyVault" --name "Github-Actions-Tailscale-OAuth-Client-Id" --query 'value' -o tsv)
          TS_SECRET=$(az keyvault secret show --vault-name "K8sHomeOpsKeyVault" --name "Github-Actions-Tailscale-OAuth-Client-Secret" --query 'value' -o tsv)
          SSH_KEY=$(az keyvault secret show --vault-name "K8sHomeOpsKeyVault" --name "Palworld-Server-SSH-Private-Key" --query 'value' -o tsv)
          SSH_HOST=$(az keyvault secret show --vault-name "K8sHomeOpsKeyVault" --name "Palworld-Server-SSH-Host" --query 'value' -o tsv)
          SSH_USER=$(az keyvault secret show --vault-name "K8sHomeOpsKeyVault" --name "Palworld-Server-SSH-User" --query 'value' -o tsv)

          echo "::add-mask::$TS_ID"
          echo "::add-mask::$TS_SECRET"
          echo "::add-mask::$SSH_HOST"
          echo "::add-mask::$SSH_USER"
          while IFS= read -r line; do
            if [[ -n "$line" ]]; then
              echo "::add-mask::$line"
            fi
          done <<< "$SSH_KEY"

          echo "TAILSCALE_OAUTH_CLIENT_ID=$TS_ID" >> $GITHUB_ENV
          echo "TAILSCALE_OAUTH_CLIENT_SECRET=$TS_SECRET" >> $GITHUB_ENV
          echo "SSH_HOST=$SSH_HOST" >> $GITHUB_ENV
          echo "SSH_USER=$SSH_USER" >> $GITHUB_ENV
          echo "SSH_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          echo "$SSH_KEY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ env.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:github-actions

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          cat << 'EOF' > ~/.ssh/id_ed25519
          ${{ env.SSH_PRIVATE_KEY }}
          EOF
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ env.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Verify that no players are online and deploy Palworld
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ env.SSH_USER }}@${{ env.SSH_HOST }} 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /home/joshua/palworld
          docker compose config --quiet

          if [[ "$(docker inspect --format '{{.State.Running}}' palworld-server 2>/dev/null || true)" == "true" ]]; then
            player_count="$(docker exec palworld-server rest-cli players | python3 -c 'import json, sys; payload = json.load(sys.stdin); players = payload.get("players"); assert isinstance(players, list); print(len(players))')" || {
              echo "Unable to determine whether players are online; leaving Palworld untouched." >&2
              exit 1
            }

            if (( player_count > 0 )); then
              echo "${player_count} player(s) are online; Palworld deployment was not started." >&2
              exit 1
            fi
          fi

          docker compose pull palworld
          docker compose up -d --no-deps palworld
          REMOTE
