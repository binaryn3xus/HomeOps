---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Deploy Palworld Server

on:
  push:
    branches:
      - main
    paths:
      - 'resources/palworld-server/docker/**'
  workflow_dispatch:

concurrency:
  group: deploy-palworld
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    name: Build and Push Palworld Save Pal Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HomeOps Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Get Palworld Save Pal Version
        id: get-version
        run: |
          VERSION=$(grep -A 1 "oMaN-Rod/palworld-save-pal" resources/palworld-server/docker/docker-compose.template.yaml | grep "image:" | sed -E 's/.*:([^:]+)$/\1/')
          echo "Extracted Version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Checkout Palworld Save Pal Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: oMaN-Rod/palworld-save-pal
          ref: ${{ steps.get-version.outputs.version }}
          path: src/palworld-save-pal

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase GitHub Repository Owner
        id: prep
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=$OWNER" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: src/palworld-save-pal
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner }}/palworld-save-pal:${{ steps.get-version.outputs.version }}
            ghcr.io/${{ steps.prep.outputs.owner }}/palworld-save-pal:latest
          build-args: |
            PUBLIC_WS_URL=localhost:5174/ws
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Remote Docker Host
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to Azure
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Fetch Deploy Secrets from Azure Key Vault
        run: |
          # 1. Fetch values from Key Vault
          TS_ID=$(az keyvault secret show --vault-name "K8sHomeOpsKeyVault" --name "Github-Actions-Tailscale-OAuth-Client-Id" --query 'value' -o tsv)
          TS_SECRET=$(az keyvault secret show --vault-name "K8sHomeOpsKeyVault" --name "Github-Actions-Tailscale-OAuth-Client-Secret" --query 'value' -o tsv)
          SSH_KEY=$(az keyvault secret show --vault-name "K8sHomeOpsKeyVault" --name "Palworld-Server-SSH-Private-Key" --query 'value' -o tsv)
          SSH_HOST=$(az keyvault secret show --vault-name "K8sHomeOpsKeyVault" --name "Palworld-Server-SSH-Host" --query 'value' -o tsv)
          SSH_USER=$(az keyvault secret show --vault-name "K8sHomeOpsKeyVault" --name "Palworld-Server-SSH-User" --query 'value' -o tsv)

          # 2. Mask secrets in GitHub logs
          echo "::add-mask::$TS_ID"
          echo "::add-mask::$TS_SECRET"
          echo "::add-mask::$SSH_HOST"
          echo "::add-mask::$SSH_USER"
          # Mask each line of the SSH key
          while IFS= read -r line; do
            if [[ -n "$line" ]]; then
              echo "::add-mask::$line"
            fi
          done <<< "$SSH_KEY"

          # 3. Export to GitHub Environment for subsequent steps
          echo "TAILSCALE_OAUTH_CLIENT_ID=$TS_ID" >> $GITHUB_ENV
          echo "TAILSCALE_OAUTH_CLIENT_SECRET=$TS_SECRET" >> $GITHUB_ENV
          echo "SSH_HOST=$SSH_HOST" >> $GITHUB_ENV
          echo "SSH_USER=$SSH_USER" >> $GITHUB_ENV
          
          # Multiline output for SSH private key
          echo "SSH_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          echo "$SSH_KEY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Connect to Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ env.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:github-actions

      - name: Inject Secrets using az-inject.sh
        run: |
          chmod +x ./az-inject.sh
          cat resources/palworld-server/docker/docker-compose.template.yaml | ./az-inject.sh > docker-compose.yaml

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          cat << 'EOF' > ~/.ssh/id_ed25519
          ${{ env.SSH_PRIVATE_KEY }}
          EOF
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ env.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copy docker-compose.yaml to Remote Host
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ env.SSH_USER }}@${{ env.SSH_HOST }} "mkdir -p /home/joshua/palworld"
          scp -i ~/.ssh/id_ed25519 docker-compose.yaml ${{ env.SSH_USER }}@${{ env.SSH_HOST }}:/home/joshua/palworld/docker-compose.yml

      - name: Deploy Stack
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ env.SSH_USER }}@${{ env.SSH_HOST }} "cd /home/joshua/palworld && docker compose pull && docker compose up -d --remove-orphans"
