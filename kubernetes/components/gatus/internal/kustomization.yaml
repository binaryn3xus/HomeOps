---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: HTTPRoute
    patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: not-used
        annotations:
          gatus.home-operations.com/endpoint: |-
            group: internal
            dns:
              query-name: ${GATUS_SUBDOMAIN:=${APP}}.unscfleet.com
              query-type: A
            url: 1.1.1.1
            conditions:
              - len([BODY]) == 0
