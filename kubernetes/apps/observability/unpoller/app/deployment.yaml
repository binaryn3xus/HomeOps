---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/apps/deployment_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unpoller
  namespace: observability
spec:
  replicas: 1
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: app
          image: ghcr.io/unpoller/unpoller:v5.2.5@sha256:123a42e6dda22d05280c7531e696ca968c63079f9d16eab11f85f458db002438
          env:
            - name: TZ
              value: "America/New_York"
            - name: UP_POLLER_DEBUG
              value: "true"
            - name: UP_UNIFI_DEFAULT_URL
              value: https://10.0.30.1
            - name: UP_PROMETHEUS_HTTP_LISTEN
              value: 0.0.0.0:80
            - name: UP_INFLUXDB_DISABLE
              value: "true"
          envFrom:
            - secretRef:
                name: unpoller-secret
          ports:
            - name: http
              containerPort: 80
          livenessProbe: &probe
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe: *probe
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
