---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tuppr-upgrade-hooks
  namespace: system-upgrade
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tuppr-upgrade-hooks-role
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "patch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tuppr-upgrade-hooks-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tuppr-upgrade-hooks-role
subjects:
  - kind: ServiceAccount
    name: tuppr-upgrade-hooks
    namespace: system-upgrade
