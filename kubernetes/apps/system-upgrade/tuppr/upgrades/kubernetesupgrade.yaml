---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/tuppr.home-operations.com/kubernetesupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: KubernetesUpgrade
metadata:
  name: kubernetes
spec:
  healthChecks:
    - apiVersion: volsync.backube/v1alpha1
      expr: |-
        status.conditions.filter(c, c.type == "Synchronizing").all(c, c.status == "False")
      kind: ReplicationSource
    - apiVersion: ceph.rook.io/v1
      expr: |-
        status.ceph.health in ['HEALTH_OK', 'HEALTH_WARN']
      kind: CephCluster
      name: rook-ceph
      namespace: rook-ceph
  kubernetes:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
    version: v1.37.0
