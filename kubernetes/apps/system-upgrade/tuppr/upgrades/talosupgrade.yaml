---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/tuppr.home-operations.com/talosupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  healthChecks:
    - apiVersion: kopiur.home-operations.com/v1alpha1
      expr: |-
        !has(status.phase) || !(status.phase in ['Pending', 'Running'])
      kind: Snapshot
    - apiVersion: ceph.rook.io/v1
      expr: |-
        status.ceph.health in ['HEALTH_OK', 'HEALTH_WARN']
      kind: CephCluster
      name: rook-ceph
      namespace: rook-ceph
    - apiVersion: postgresql.cnpg.io/v1
      expr: |-
        status.phase == 'Cluster in healthy state'
      kind: Cluster
  policy:
    rebootMode: powercycle
    waitForVolumeDetach: true
  talos:
    # renovate: datasource=custom.talos-factory depName=siderolabs/talos
    version: v1.14.7
