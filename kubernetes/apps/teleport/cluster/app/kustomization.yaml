---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - certificates.yaml
  - helmrelease.yaml
  - ocirepository.yaml
labels:
  - pairs:
      app.kubernetes.io/name: teleport
      app.kubernetes.io/instance: teleport
    includeSelectors: true
patches:
  # Teleport runs as root and writes files (such as audit-queue in v19+) with root ownership and 0700 perms.
  # The root mover requires DAC capabilities to read and snapshot these files cleanly.
  - target:
      kind: SnapshotPolicy
    patch: |-
      - op: add
        path: /spec/mover/securityContext/capabilities
        value:
          add:
            - DAC_READ_SEARCH
            - DAC_OVERRIDE
