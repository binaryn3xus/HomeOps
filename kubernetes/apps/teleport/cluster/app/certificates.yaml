---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: teleport-proxy-public-cert
  namespace: teleport
spec:
  commonName: teleport.unscfleet.com
  dnsNames:
    - teleport.unscfleet.com
    - "*.teleport.unscfleet.com"
  subject:
    countries: ["US"]
    organizations: ["binaryn3xus-homeops"]
    provinces: ["NC"]
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-production
  secretName: teleport-proxy-public-cert
