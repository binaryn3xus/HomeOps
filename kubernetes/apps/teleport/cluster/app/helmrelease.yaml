---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app teleport
spec:
  interval: 15m
  chart:
    spec:
      chart: teleport-cluster
      version: 18.11.0
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: teleport
        namespace: teleport

  values:
    acme: false

    auth:
      annotations:
        deployment:
          reloader.stakater.com/auto: 'true'
      teleportConfig:
        auth_service:
          client_idle_timeout: 2h
          client_idle_timeout_message: Connection closed after 2hours without activity
          session_recording: 'off'
        kubernetes_service:
          enabled: false

    authentication:
      type: github

    chartMode: standalone
    clusterName: teleport.unscfleet.com
    enterprise: false

    kubeClusterName: "HomeOpsCluster"

    log:
      extraFields: ["timestamp", "level", "component", "caller"]
      format: text
      level: DEBUG
      output: stderr

    installCRDs: true

    operator:
      enabled: true

    persistence:
      enabled: true
      existingClaimName: teleport

    podMonitor:
      additionalLabels:
        prometheus: default
      enabled: true
      interval: 30s

    proxy:
      annotations:
        service:
          coredns.io/hostname: teleport.unscfleet.com
          lbipam.cilium.io/ips: "10.0.30.42"
        deployment:
          reloader.stakater.com/auto: 'true'
      teleportConfig:
        proxy_service:
          trust_x_forwarded_for: true
        kubernetes_service:
          enabled: false

    tls:
      existingSecretName: teleport-proxy-public-cert

    proxyListenerMode: multiplex
    proxyProtocol: "off"

    publicAddr:
      - teleport.unscfleet.com:443

    rbac:
      create: true

    service:
      type: LoadBalancer

    serviceAccount:
      create: true

    validateConfigOnDeploy: true
