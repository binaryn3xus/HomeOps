          "datasource": {
            "type": "prometheus",
            "uid": "$${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "count({__name__=~\"(homeassistant_)?entity_available\"} == 1)",
              "refId": "A"
            }
