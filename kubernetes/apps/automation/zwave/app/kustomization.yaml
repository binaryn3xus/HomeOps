---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonLabels:
  app.kubernetes.io/name: zwave
  app.kubernetes.io/instance: zwave
  app.kubernetes.io/controller: zwave
resources:
  - ./externalsecret.yaml
  - ./configmap.yaml
  - ./deployment.yaml
  - ./service.yaml
  - ./httproute.yaml
patches:
  # zwave-js-ui runs as root and writes files with root:1000 ownership and restrictive perms.
  # The root mover requires DAC capabilities to read and snapshot these files cleanly.
  - target:
      kind: SnapshotPolicy
    patch: |-
      - op: add
        path: /spec/mover/securityContext/capabilities
        value:
          add:
            - DAC_READ_SEARCH
            - DAC_OVERRIDE
