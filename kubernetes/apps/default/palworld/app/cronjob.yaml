---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: palworld-synology-backup
spec:
  schedule: "30 */12 * * *"
  timeZone: "America/New_York"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            sku: gaming
          tolerations:
            - key: sku
              operator: Equal
              value: gaming
              effect: NoSchedule
          containers:
            - name: sync
              image: docker.io/instrumentisto/rsync-ssh:alpine
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  echo "Creating target directory on Synology if it doesn't exist..."
                  mkdir -p /media/Gaming/Palworld/UNSC-Palworld/Backups
                  echo "Syncing backup zips to Synology share..."
                  rsync -rltvz --ignore-errors --no-owner --no-group --no-perms \
                    /palworld/Pal/Saved/SaveGames/0/72597299B08041C5A9572392CEF9D3B1/backup/world/ \
                    /media/Gaming/Palworld/UNSC-Palworld/Backups/
                  echo "Backup copy to Synology complete!"
              volumeMounts:
                - name: palworld-data
                  mountPath: /palworld
                  readOnly: true
                - name: synology-media
                  mountPath: /media
          volumes:
            - name: palworld-data
              persistentVolumeClaim:
                claimName: palworld
            - name: synology-media
              nfs:
                server: "10.0.30.4"
                path: /volume1/Media
