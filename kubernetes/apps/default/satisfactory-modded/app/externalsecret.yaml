---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: satisfactory-modded
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: satisfactory-modded-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SFTP_USERS: "ficsit:{{ .sftp_password }}:1000:1000:satisfactory"
  data:
    - secretKey: sftp_password
      remoteRef:
        key: Satisfactory-Modded-SFTP-Password
