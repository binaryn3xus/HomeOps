---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/apps/deployment_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: satisfactory-modded
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: satisfactory-modded
      app.kubernetes.io/instance: satisfactory-modded
      app.kubernetes.io/controller: satisfactory-modded
  template:
    metadata:
      labels:
        app.kubernetes.io/name: satisfactory-modded
        app.kubernetes.io/instance: satisfactory-modded
        app.kubernetes.io/controller: satisfactory-modded
    spec:
      terminationGracePeriodSeconds: 120
      nodeSelector:
        sku: gaming
      tolerations:
        - key: sku
          operator: Equal
          value: gaming
          effect: NoSchedule
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: sync-certificates
          image: docker.io/library/busybox:1.38.0
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /config/gamefiles/FactoryGame/Certificates
              cp -L /certs/cert_chain.pem /config/gamefiles/FactoryGame/Certificates/cert_chain.pem
              cp -L /certs/private_key.pem /config/gamefiles/FactoryGame/Certificates/private_key.pem
              chown -R 1000:1000 /config/gamefiles/FactoryGame/Certificates
              chmod 600 /config/gamefiles/FactoryGame/Certificates/*
          volumeMounts:
            - name: config
              mountPath: /config
            - name: certificates
              mountPath: /certs
              readOnly: true
      containers:
        - name: app
          image: docker.io/wolveix/satisfactory-server:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          envFrom:
            - configMapRef:
                name: satisfactory-modded-env
          ports:
            - name: game-udp
              containerPort: 7778
              protocol: UDP
            - name: game-tcp
              containerPort: 7778
              protocol: TCP
            - name: messaging-tcp
              containerPort: 8889
              protocol: TCP
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: config
              mountPath: /config

        - name: sftp
          image: docker.io/atmoz/sftp:latest
          envFrom:
            - secretRef:
                name: satisfactory-modded-secrets
          ports:
            - name: sftp
              containerPort: 22
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /home/ficsit/satisfactory

        - name: save-web
          image: docker.io/library/python:3.15-alpine
          command:
            - python3
            - /app/server.py
          env:
            - name: SAVES_DIR
              value: /config/saved/server
            - name: PORT
              value: "8080"
          ports:
            - name: http-saves
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: save-server-script
              mountPath: /app
              readOnly: true

      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: satisfactory-modded
        - name: certificates
          secret:
            secretName: satisfactory-modded-tls
            items:
              - key: tls.crt
                path: cert_chain.pem
              - key: tls.key
                path: private_key.pem
        - name: save-server-script
          configMap:
            name: satisfactory-modded-save-server-script
