---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: satisfactory-modded
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: satisfactory-modded
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    nodeSelector:
      sku: gaming
    tolerations:
      - key: sku
        operator: Equal
        value: gaming
        effect: NoSchedule

    server:
      config:
        serverName: "UNSC-Section-III"
        gamePort: 7778
        messagingPort: 8889
        maxPlayers: 8
        maxTickRate: 30
        autoSaveNum: 5
        autoSaveInterval: 300
        autoPause: true
        extraArgs: "-ini:Engine:[SystemSettings]:FG.DedicatedServer.AllowInsecureLocalAccess=1"
        steam:
          branch: public
          updateOnStart: true
          validate: true
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
        limits:
          cpu: "4"
          memory: 8Gi

    mods:
      enabled: true
      strictMode: true
      profileName: "UNSC-Section-III"
      updatePolicy: "always"
      items:
        - ref: BlueprintHighlighted
          version: latest
        - ref: BoomBoxPlus
          version: latest
        - ref: DaisyChainEverything
          version: latest
        - ref: FasterManualCraftingRedux
          version: latest
        - ref: FicsitRemoteMonitoring
          version: latest
        - ref: InfiniteNudge
          version: latest
        - ref: InfiniteZoop
          version: latest
        - ref: InfiniteDismantle
          version: latest
        - ref: ModUpdateNotifier
          version: latest
        - ref: NoFuel
          version: latest
        - ref: NoHoverPackDrift
          version: latest
        - ref: PEP_Mod
          version: latest
        - ref: SkyUI
          version: latest

    portal:
      enabled: true
      port: 8081
      frmApiUrl: "http://127.0.0.1:8080"
      route:
        enabled: true
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        hostnames:
          - satisfactory-modded-saves.unscfleet.com

    sftp:
      enabled: false

    service:
      game:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "10.0.30.41"
          external-dns.kubernetes.io/hostname: "satisfactory-modded.unscfleet.com"
          external-dns.alpha.kubernetes.io/hostname: "satisfactory-modded.unscfleet.com"

    tls:
      certManager:
        enabled: true
        commonName: satisfactory-modded.unscfleet.com
        dnsNames:
          - satisfactory-modded.unscfleet.com
        issuerRef:
          name: letsencrypt-production
          kind: ClusterIssuer

    persistence:
      enabled: true
      existingClaim: satisfactory-modded

    backup:
      enabled: true
      schedule: "0 */6 * * *"
      timeZone: "America/New_York"
      nfs:
        server: "10.0.30.4"
        path: "/volume1/Media"
        targetSubDir: "Gaming/Satisfactory-Modded"
