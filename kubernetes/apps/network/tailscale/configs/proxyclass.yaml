---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/tailscale.com/proxyclass_v1alpha1.json
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: tailscale-subnet-router-pc
spec:
  statefulSet:
    pod:
      tailscaleContainer:
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
              - NET_RAW
