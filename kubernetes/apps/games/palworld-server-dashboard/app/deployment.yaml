apiVersion: apps/v1
kind: Deployment
metadata:
  name: palworld-server-dashboard
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: palworld-server-dashboard
      app.kubernetes.io/instance: palworld-server-dashboard
      app.kubernetes.io/controller: palworld-server-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: palworld-server-dashboard
        app.kubernetes.io/instance: palworld-server-dashboard
        app.kubernetes.io/controller: palworld-server-dashboard
    spec:
      containers:
        - name: app
          image: ghcr.io/rnz01/palworld-server-dashboard:latest
          env:
            - name: TZ
              value: "America/New_York"
            - name: PALWORLD_REST_URL
              value: "http://palworld-server:8212"
            - name: RATE_LIMIT_TRUST_PROXY
              value: "true"
            - name: PALWORLD_PLAYER_ACTIVITY
              value: "true"
            - name: PANEL_INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: palworld-server-dashboard-secrets
                  key: PANEL_INITIAL_ADMIN_PASSWORD
            - name: PALWORLD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: palworld-server-dashboard-secrets
                  key: PALWORLD_ADMIN_PASSWORD
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
