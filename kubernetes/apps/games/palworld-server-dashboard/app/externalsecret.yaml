---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: palworld-server-dashboard
spec:
  data:
    - remoteRef:
        key: Palworld-Dashboard-Admin-Password
      secretKey: panel_initial_admin_password
    - remoteRef:
        key: Palworld-Admin-Password
      secretKey: palworld_admin_password
  refreshInterval: "12h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    creationPolicy: Owner
    name: palworld-server-dashboard-secrets
    template:
      data:
        PANEL_INITIAL_ADMIN_PASSWORD: "{{ .panel_initial_admin_password }}"
        PALWORLD_ADMIN_PASSWORD: "{{ .palworld_admin_password }}"
      engineVersion: v2
