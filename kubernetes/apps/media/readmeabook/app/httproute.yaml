apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: readmeabook
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - readmeabook.unscfleet.com
  rules:
    - backendRefs:
        - name: readmeabook
          port: 80
