apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: watchstate
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - watchstate.unscfleet.com
  rules:
    - backendRefs:
        - name: watchstate
          port: 8080
