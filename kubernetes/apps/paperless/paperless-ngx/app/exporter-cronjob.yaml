---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: paperless-exporter
  namespace: paperless
spec:
  timeZone: "America/New_York"
  schedule: "30 5 * * *" # Daily at 5:30 AM
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          containers:
            - name: exporter
              image: ghcr.io/paperless-ngx/paperless-ngx:3.2.0
              command:
                - /bin/sh
                - -c
                - |
                  echo "Starting Paperless document export..."
                  /usr/local/bin/python3 /usr/src/paperless/src/manage.py document_exporter /usr/src/paperless/export \
                    --no-progress-bar -c -cj -d -f -nt -sm
                  STATUS=$?
                  if [ $STATUS -eq 0 ]; then
                    echo "Export completed successfully at $(date)!"
                    echo "Total files in export: $(find /usr/src/paperless/export -type f | wc -l)"
                  else
                    echo "Export failed with exit code $STATUS"
                    exit $STATUS
                  fi
              env:
                - name: TZ
                  value: "America/New_York"
                - name: PAPERLESS_DBENGINE
                  value: "postgresql"
                - name: PAPERLESS_REDIS
                  value: redis://valkey.paperless.svc.cluster.local:6379
                - name: PAPERLESS_DBHOST
                  value: paperless-postgres-rw.paperless.svc.cluster.local
                - name: PAPERLESS_DBNAME
                  value: paperless
                - name: PAPERLESS_DBUSER
                  value: paperless
                - name: PAPERLESS_DBPASS
                  valueFrom:
                    secretKeyRef:
                      name: paperless-secrets
                      key: PAPERLESS_ADMIN_PASSWORD
                - name: PAPERLESS_FILENAME_FORMAT
                  value: "{{ created_year }}/{{ correspondent }}/{{ document_type }}/{{ title }}"
                - name: PAPERLESS_FILENAME_FORMAT_REMOVE_NONE
                  value: "true"
              envFrom:
                - secretRef:
                    name: paperless-secrets
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 2000m
                  memory: 2048Mi
              volumeMounts:
                - name: synology
                  mountPath: /usr/src/paperless/export
                  subPath: export
                - name: synology
                  mountPath: /usr/src/paperless/data
                  subPath: data
                - name: synology
                  mountPath: /usr/src/paperless/media
                  subPath: media
          volumes:
            - name: synology
              persistentVolumeClaim:
                claimName: synology
