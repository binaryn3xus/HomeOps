---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app paperless
  namespace: &namespace paperless
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/gatus/internal
    - ../../../../components/common/labels
  dependsOn:
    - name: paperless-postgres
      namespace: paperless
    - name: valkey
      namespace: paperless
    - name: tika
      namespace: paperless
    - name: gotenberg
      namespace: paperless
  interval: 30m
  path: ./kubernetes/apps/paperless/paperless-ngx/app
  postBuild:
    substitute:
      APP: *app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
