---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headroom
  namespace: ai
spec:
  data:
    - remoteRef:
        key: HomeOps-LiteLLM-Headroom-Canary-Key
      secretKey: litellm_canary_api_key
    - remoteRef:
        key: HomeOps-Headroom-Proxy-Token
      secretKey: proxy_token
  refreshInterval: "12h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    creationPolicy: Owner
    name: headroom-secret
    template:
      data:
        HEADROOM_PROXY_TOKEN: "{{ .proxy_token }}"
        # This overrides the proxy credential before forwarding upstream.
        OPENAI_TARGET_API_HEADERS: '{"Authorization":"Bearer {{ .litellm_canary_api_key }}"}'
      engineVersion: v2
