---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/apps/deployment_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headroom
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: headroom
      app.kubernetes.io/instance: headroom
      app.kubernetes.io/controller: headroom
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headroom
        app.kubernetes.io/instance: headroom
        app.kubernetes.io/controller: headroom
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: ghcr.io/chopratejas/headroom:0.27.0
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8787"
            - --no-telemetry
          env:
            # The canary clients call Headroom, which forwards their original
            # LiteLLM virtual-key authorization to this internal gateway.
            - name: OPENAI_TARGET_API_URL
              value: http://litellm.ai.svc.cluster.local:4000/v1
            - name: HEADROOM_WORKSPACE_DIR
              value: /tmp/headroom
          ports:
            - name: http
              containerPort: 8787
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
