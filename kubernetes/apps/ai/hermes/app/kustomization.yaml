---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./deployment.yaml
  - ./service.yaml
  - ./externalsecret.yaml
  - ./httproute.yaml
  - ./rbac.yaml
configMapGenerator:
  - name: hermes-config
    files:
      - config.yaml
  - name: hermes-scripts
    files:
      - setup.sh
      - git-askpass.sh
generatorOptions:
  disableNameSuffixHash: true
