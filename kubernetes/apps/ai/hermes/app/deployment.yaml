---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/apps/deployment_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: ai
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-agent
      app.kubernetes.io/instance: hermes
  template:
    metadata:
      annotations:
        # ConfigMap volumes update in place; this revision also reruns the init
        # setup so persistent helper scripts are refreshed with the mounted copy.
        hermes.binaryn3xus.io/setup-revision: "2026-08-30-1"
      labels:
        app.kubernetes.io/name: hermes-agent
        app.kubernetes.io/instance: hermes
    spec:
      serviceAccountName: hermes
      # Hermes performs repository work through GitHub; it does not need an
      # in-cluster API token. This also makes the removed cluster-admin binding
      # ineffective even if it were accidentally restored.
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: setup
          image: nousresearch/hermes-agent:v2026.8.31@sha256:64923faeae267792bf9bf87fe3b4c4869e35004e360c7df01730ad801b74d524
          command: ["bash", "/tmp/scripts/setup.sh"]
          env:
            - name: DOTNET_SYSTEM_GLOBALIZATION_INVARIANT
              value: "1"
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: config-source
              mountPath: /tmp/config-source
            - name: scripts
              mountPath: /tmp/scripts
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:v2026.8.31@sha256:64923faeae267792bf9bf87fe3b4c4869e35004e360c7df01730ad801b74d524
          # BYPASS S6: Run processes directly
          command: ["/bin/bash", "-c"]
          args:
            - |
              # Load persisted environment
              if [ -f /opt/data/hermes.env ]; then
                source /opt/data/hermes.env
              fi

              # Supervise both long-lived processes so Kubernetes termination
              # is graceful and SQLite state is flushed before the pod exits.
              /opt/hermes/.venv/bin/hermes dashboard --host 0.0.0.0 --insecure &
              dashboard_pid=$!

              /opt/hermes/.venv/bin/hermes gateway run --no-supervise &
              gateway_pid=$!

              shutdown() {
                kill -TERM "$gateway_pid" "$dashboard_pid" 2>/dev/null || true
                wait "$gateway_pid" 2>/dev/null || true
                wait "$dashboard_pid" 2>/dev/null || true
              }
              trap shutdown TERM INT

              wait "$gateway_pid"
              gateway_status=$?
              kill -TERM "$dashboard_pid" 2>/dev/null || true
              wait "$dashboard_pid" 2>/dev/null || true
              exit "$gateway_status"
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: HOME
              value: /opt/data
            - name: DOTNET_ROOT
              value: "/opt/data/dotnet"
            - name: DOTNET_SYSTEM_GLOBALIZATION_INVARIANT
              value: "1"
            - name: PATH
              value: "/opt/data/dotnet:/opt/data/.dotnet/tools:/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            - name: TZ
              value: America/New_York
            - name: GATEWAY_ALLOW_ALL_USERS
              value: "false"
            # Hermes and common developer tools look for different conventional
            # token names. Keep GH_TOKEN for existing integrations and provide
            # GITHUB_TOKEN for repository automation.
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-secret
                  key: GH_TOKEN
            # The GitHub PAT belongs to this account. GitHub accepts it as the
            # HTTPS password only when paired with the account username.
            - name: GITHUB_USERNAME
              value: binaryn3xus
            # Make HTTPS git operations non-interactive and authenticate with
            # the token without persisting it in .gitconfig or repository URLs.
            - name: GIT_ASKPASS
              value: /opt/data/bin/git-askpass
            - name: GIT_TERMINAL_PROMPT
              value: "0"
          envFrom:
            - secretRef:
                name: hermes-agent-secret
          ports:
            - containerPort: 8642
              name: gateway
            - containerPort: 9119
              name: dashboard
          livenessProbe:
            httpGet:
              path: /login
              port: dashboard
            initialDelaySeconds: 60
            periodSeconds: 60
          readinessProbe:
            httpGet:
              path: /login
              port: dashboard
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: config-source
          configMap:
            name: hermes-config
        - name: scripts
          configMap:
            name: hermes-scripts
            defaultMode: 0755
        - name: tmp
          emptyDir: {}
