model:
  default: "gpt-5.4"
  provider: "openai-codex"

# Keep Codex as the default for dependable repository work. These aliases let
# a Kanban task or chat session deliberately choose a cluster-local model for
# inexpensive triage, summaries, and lightweight code review.
providers:
  ollama:
    base_url: "http://ollama.ai.svc.cluster.local:11434"

model_aliases:
  local-fast:
    model: "llama3.2:latest"
    provider: "ollama"
    base_url: "http://ollama.ai.svc.cluster.local:11434"
  local-code:
    model: "qwen2.5-coder:7b"
    provider: "ollama"
    base_url: "http://ollama.ai.svc.cluster.local:11434"

agent:
  max_turns: 60
  verbose: false
  reasoning_effort: "medium"
  toolsets:
    - all

approvals:
  # Permit routine, low-risk repository work but require confirmation for
  # destructive or ambiguous shell operations.
  mode: "smart"

auxiliary:
  vision:
    provider: "openai-codex"
  web_extract:
    provider: "openai-codex"
  session_search:
    provider: "openai-codex"
  kanban_decomposition:
    provider: "openai-codex"

command_allowlist:
  - "git *"
  - "npm *"
  - "node *"
  - "python *"
  - "pip *"
  - "ls *"
  - "cat *"
  - "mkdir *"
  - "rm -rf /tmp/*"

consents:
  outbound_access:
    mode: "smart"
    allowlist:
      - "10.0.10.1"
      - "*.unscfleet.com"
      - "*.svc.cluster.local"
      - "api.github.com"
      - "github.com"

kanban:
  auto_decompose: true
  auto_promote_profiles:
    - "coder"
    - "networker"
    - "default"

terminal:
  backend: "local"
  cwd: "/opt/data"
  # Builds, dependency restores, and test suites regularly exceed one minute.
  timeout: 900

security:
  redact_secrets: true

checkpoints:
  enabled: true
  max_snapshots: 20

display:
  personality: "kawaii"
  streaming: true
  tool_progress: all

discord:
  require_mention: true
  free_response_channels: ""
  allowed_channels: "1506866536508555414"
  auto_thread: true
  thread_require_mention: false
  history_backfill: true
  history_backfill_limit: 30
  reactions: false
  channel_prompts: {}
  dm_role_auth_guild: ""
  server_actions: ""

skills:
  creation_nudge_interval: 15
