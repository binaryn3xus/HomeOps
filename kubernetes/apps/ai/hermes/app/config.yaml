model:
  default: "gpt-5.4"
  provider: "openai-codex"

# Keep Codex as the default for dependable repository work. These aliases let
# a Kanban task or chat session deliberately choose a cluster-local model for
# inexpensive triage, summaries, and lightweight code review. Route through
# LiteLLM so usage is attributed to Hermes and Ollama stays private to the
# gateway.
providers:
  homeops:
    name: "HomeOps LiteLLM"
    base_url: "http://litellm.ai.svc.cluster.local:4000/v1"
    key_env: "LITELLM_API_KEY"
    # Keep the picker stable and avoid an unnecessary discovery request on
    # every dashboard open. LiteLLM owns the full model catalog.
    discover_models: false
    models:
      - "homeops/local-fast"
      - "homeops/local-code"
  homeops-canary:
    name: "HomeOps LiteLLM Canary"
    base_url: "http://headroom.ai.svc.cluster.local:8787/v1"
    key_env: "LITELLM_HEADROOM_CANARY_API_KEY"
    extra_headers:
      X-Headroom-Proxy-Token: "$${HEADROOM_PROXY_TOKEN}"
    discover_models: false
    models:
      - "homeops/local-fast"
      - "homeops/local-code"

model_aliases:
  local-fast:
    model: "homeops/local-fast"
    provider: "custom"
    base_url: "http://litellm.ai.svc.cluster.local:4000/v1"
    key_env: "LITELLM_API_KEY"
  local-code:
    model: "homeops/local-code"
    provider: "custom"
    base_url: "http://litellm.ai.svc.cluster.local:4000/v1"
    key_env: "LITELLM_API_KEY"
  local-fast-canary:
    model: "homeops/local-fast"
    provider: "homeops-canary"
  local-code-canary:
    model: "homeops/local-code"
    provider: "homeops-canary"

agent:
  max_turns: 60
  verbose: false
  reasoning_effort: "medium"
  toolsets:
    - all

approvals:
  # Permit routine, low-risk repository work but require confirmation for
  # destructive or ambiguous shell operations.
  mode: "smart"

auxiliary:
  vision:
    provider: "openai-codex"
  web_extract:
    provider: "openai-codex"
  session_search:
    provider: "openai-codex"
  kanban_decomposition:
    provider: "openai-codex"

command_allowlist:
  - "git *"
  - "npm *"
  - "node *"
  - "python *"
  - "pip *"
  - "ls *"
  - "cat *"
  - "mkdir *"
  - "rm -rf /tmp/*"

consents:
  outbound_access:
    mode: "smart"
    allowlist:
      - "10.0.10.1"
      - "*.unscfleet.com"
      - "*.svc.cluster.local"
      - "api.github.com"
      - "github.com"

kanban:
  auto_decompose: true
  auto_promote_profiles:
    - "coder"
    - "networker"
    - "default"

terminal:
  backend: "local"
  cwd: "/opt/data"
  # Builds, dependency restores, and test suites regularly exceed one minute.
  timeout: 900
  # GitHub repository tasks need these credentials inside the model-driven
  # terminal process for non-interactive clone, push, and PR workflows.
  # Keep the PAT repository-scoped and rotate it if a task handles untrusted
  # content.
  env_passthrough:
    - "GH_TOKEN"
    - "GITHUB_TOKEN"

security:
  redact_secrets: true

checkpoints:
  enabled: true
  max_snapshots: 20

display:
  personality: "kawaii"
  streaming: true
  tool_progress: all

discord:
  require_mention: true
  free_response_channels: ""
  allowed_channels: "1506866536508555414"
  auto_thread: true
  thread_require_mention: false
  history_backfill: true
  history_backfill_limit: 30
  reactions: false
  channel_prompts: {}
  dm_role_auth_guild: ""
  server_actions: ""

skills:
  creation_nudge_interval: 15
