---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/barmancloud.cnpg.io/objectstore_v1.json
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: litellm-db
  namespace: ai
spec:
  configuration:
    data:
      compression: bzip2
      jobs: 4
    destinationPath: s3://cnpg-litellm/
    endpointURL: "https://542984caaa7dbec621de30100e1e7b23.r2.cloudflarestorage.com"
    s3Credentials:
      accessKeyId:
        name: litellm-db-secret
        key: backupAccessKeyId
      secretAccessKey:
        name: litellm-db-secret
        key: backupAccessSecret
    wal:
      compression: bzip2
      maxParallel: 4
  retentionPolicy: 30d
