# LiteLLM is the sole client-facing model endpoint. Keep raw Ollama private to
# the cluster and add cloud providers here only in later, dedicated changes.
model_list:
  - model_name: homeops/local-code
    litellm_params:
      model: ollama/qwen2.5-coder:7b
      api_base: http://ollama.ai.svc.cluster.local:11434
  - model_name: homeops/local-fast
    litellm_params:
      model: ollama/llama3.2:latest
      api_base: http://ollama.ai.svc.cluster.local:11434
  - model_name: homeops/embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama.ai.svc.cluster.local:11434

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

# Keep compression opt-in while its effect on long-running agent sessions is
# measured. Attach this guardrail only to the Headroom canary virtual key.
guardrails:
  - guardrail_name: headroom-compression
    litellm_params:
      guardrail: headroom
      mode: pre_call
      api_base: http://headroom.ai.svc.cluster.local:8787
      default_on: false
      unreachable_fallback: fail_open

litellm_settings:
  set_verbose: false
