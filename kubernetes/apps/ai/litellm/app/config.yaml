# LiteLLM is the sole client-facing model endpoint. Keep raw Ollama private to
# the cluster and add cloud providers here only in later, dedicated changes.
model_list:
  - model_name: homeops/local-code
    litellm_params:
      model: ollama/qwen2.5-coder:7b
      api_base: http://ollama.ai.svc.cluster.local:11434
  - model_name: homeops/local-fast
    litellm_params:
      model: ollama/llama3.2:latest
      api_base: http://ollama.ai.svc.cluster.local:11434
  # Gemma 4 emits native OpenAI-compatible tool_calls, unlike the lightweight
  # chat and code models above. Keep it separate for Hermes agentic sessions.
  - model_name: homeops/local-agent
    litellm_params:
      model: ollama/gemma4:e2b
      api_base: http://ollama.ai.svc.cluster.local:11434
  - model_name: homeops/embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama.ai.svc.cluster.local:11434

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  set_verbose: false
