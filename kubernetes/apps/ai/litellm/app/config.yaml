# LiteLLM is the sole client-facing model endpoint. Keep raw Ollama private to
# the cluster and add cloud providers here only in later, dedicated changes.
model_list:
  - model_name: homeops/local-code
    litellm_params:
      model: ollama/qwen2.5-coder:7b
      api_base: http://ollama.ai.svc.cluster.local:11434
  - model_name: homeops/local-fast
    litellm_params:
      model: ollama/llama3.2:latest
      api_base: http://ollama.ai.svc.cluster.local:11434
  - model_name: homeops/embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama.ai.svc.cluster.local:11434
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-flash-latest
      api_key: os.environ/GEMINI_API_KEY
  - model_name: gemini-flash-lite
    litellm_params:
      model: gemini/gemini-flash-lite-latest
      api_key: os.environ/GEMINI_API_KEY
  # ChatGPT models require device OAuth login and persistent token storage
  # - model_name: chatgpt-5.6-sol
  #   litellm_params:
  #     model: chatgpt/gpt-5.6-sol
  # - model_name: chatgpt-5.6-terra
  #   litellm_params:
  #     model: chatgpt/gpt-5.6-terra

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  set_verbose: false
