---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  interval: 1h
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  values:
    monitoring:
      enabled: true
      createPrometheusRules: true
      prometheusRuleOverrides:
        CephPoolGrowthWarning:
          expr: (predict_linear(ceph_pool_percent_used[2d], 3600 * 24 * 5) * on(cluster, pool_id, instance, pod) group_right() ceph_pool_metadata) >= 95
    toolbox:
      enabled: true
    route:
      dashboard:
        annotations:
          gatus.home-operations.com/endpoint: |-
            group: internal
            dns:
              query-name: rook.unscfleet.com
              query-type: A
            url: 1.1.1.1
            conditions:
              - len([BODY]) == 0
        host:
          name: rook.unscfleet.com
          path: /
          pathType: PathPrefix
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    cephClusterSpec:
      resources:
        mgr:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            memory: 1Gi
        osd:
          limits:
            memory: 8Gi
      cephConfig:
        global:
          mon_clock_drift_allowed: "0.10"
          mon_data_avail_warn: "15"
          bdev_enable_discard: "true"
          bdev_async_discard: "true"
          bdev_async_discard_threads: "1"
          bdev_stalled_read_warn_lifetime: "7200"
          bdev_stalled_read_warn_threshold: "5"
          bluestore_slow_ops_warn_lifetime: "0"
          osd_class_update_on_start: "false"
      cleanupPolicy:
        wipeDevicesFromOtherClusters: true
      crashCollector:
        disable: false
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://prometheus-operated.observability.svc.cluster.local:9090
      mgr:
        modules:
          - name: pg_autoscaler
            enabled: true
      network:
        provider: host
        connections:
          requireMsgr2: true
      security:
        cephx:
          csi:
            keyType: aes # aes256k requires kernel 7.0+
          daemon:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
      storage:
        useAllNodes: false
        useAllDevices: false
        config:
          osdsPerDevice: "1"
        nodes:
          - name: fleetcom-node1
            devices:
              - name: "/dev/disk/by-id/nvme-eui.6479a79f0ad000f0"
          - name: fleetcom-node2
            devices:
              - name: "/dev/disk/by-id/nvme-eui.002538da11446b18"
          - name: fleetcom-node3
            devices:
              - name: "/dev/disk/by-id/nvme-eui.002538da114551c2"
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
          parameters:
            target_size_ratio: ".85"
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions: ["discard"]
          parameters:
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      isDefault: true
      deletionPolicy: Delete
    # Note: Explicitly set to empty to override rook-ceph-cluster chart defaults (which deploy ceph-filesystem and ceph-objectstore if omitted)
    cephFileSystems: []
    cephFileSystemVolumeSnapshotClass:
      enabled: false
    cephObjectStores: []
